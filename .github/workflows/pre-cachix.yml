name: Update kernel matrix

on:
  workflow_dispatch:
  push:
  pull_request:

jobs:
  update:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: cachix/install-nix-action@v27

      - name: Generate kernel list
        id: gen
        shell: bash
        run: |
          kernels=$(nix eval '.#legacyPackages.x86_64-linux.safeKernelNames' --json \
            | jq -r '.[]')

          yaml="kernel: [$(echo "$kernels" | paste -sd, -)]"

          echo "$yaml" > kernel_fragment.txt

      - name: Update workflow YAML
        run: |
          KERNELS=$(nix eval '.#legacyPackages.x86_64-linux.safeKernelNames' --json | jq -r '.[]' | paste -sd ', ' -)
          sed -i -E "s|^([[:space:]]*kernel:[[:space:]]*)\[.*\]|\1[ $KERNELS ]|" .github/workflows/cachix.yml

      - name: Setup SSH signing + git config
        run: |
          mkdir -p ~/.ssh

          echo "${{ secrets.CODEBERG_SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/id_ed25519.pub
          git config --global commit.gpgsign true

      - name: Commit updated matrix
        run: |
          git add .github/workflows/cachix.yml

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -S -m "chore: update kernel matrix"

      - name: Push to Codeberg
        run: |
          git remote add codeberg git@codeberg.org:pandapip1/nixos-linux-rt.git
          git push codeberg HEAD:main

      - name: Trigger workflow
        run: |
          echo "${{ secrets.GITHUB_TOKEN }}" | gh auth login --with-token
          gh workflow run cachix.yml --ref main
