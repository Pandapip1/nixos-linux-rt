name: Build and Upload to Attic
concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  push:
jobs:
  build:
    runs-on: ${{ matrix.arch == 'aarch64-linux' && 'ubuntu-24.04-arm' || 'ubuntu-latest' }}
    strategy:
      fail-fast: false
      matrix:
        arch: [ x86_64-linux, aarch64-linux ]
        kernel: [ linux_6_12, linux_6_18, linux_7_0, linux_default, linux_latest, linux_rpi1, linux_rpi2, linux_rpi3, linux_rpi4, linux_testing, linux_xanmod, linux_xanmod_latest, linux_xanmod_stable, linux_zen ]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install Nix
        uses: cachix/install-nix-action@v27
        with:
          extra_nix_config: |
            experimental-features = nix-command flakes

      - name: Setup Attic cache
        uses: ryanccn/attic-action@v0
        with:
          endpoint: https://nixos.cache.pandapip1.com/
          cache: nixos-linux-rt
          token: ${{ secrets.ATTIC_TOKEN }}

      - name: Build kernel
        run: |
          SUPPORTED=$(nix eval --json .#legacyPackages.${{ matrix.arch }}.kernels.${{ matrix.kernel }}.meta.platforms 2>/dev/null || echo "[]")
          BROKEN=$(nix eval --json .#legacyPackages.${{ matrix.arch }}.kernels.${{ matrix.kernel }}.meta.broken 2>/dev/null || echo "false")
          if [ "$BROKEN" = "true" ]; then
            echo "::notice::Skipping ${{ matrix.kernel }} on ${{ matrix.arch }}; marked as broken."
          elif echo "$SUPPORTED" | grep -qF "${{ matrix.arch }}"; then
            nix build .#legacyPackages.${{ matrix.arch }}.kernels.${{ matrix.kernel }} --no-link --print-build-logs
          else
            echo "::notice::Skipping ${{ matrix.kernel }} on ${{ matrix.arch }}; not in supported platforms."
          fi
