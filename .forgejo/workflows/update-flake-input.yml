name: Update Flake Inputs

on:
  schedule:
    - cron: "0 0 * * *"
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  update-flakes:
    runs-on: codeberg-tiny-lazy
    strategy:
      fail-fast: false
      matrix:
        input:
          - nixpkgs
          - flake-parts
    steps:
      - name: Checkout repository
        uses: https://data.forgejo.org/actions/checkout@v4

      - name: Set up Nix
        uses: https://github.com/cachix/install-nix-action@v31.9.0
        with:
          GITHUB_TOKEN: ""

      - name: Set up git
        run: |
          set -eux pipefail
          mkdir -p ~/.ssh

          echo "${{ secrets.SSH_KEY }}" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keygen -y -f ~/.ssh/id_ed25519 > ~/.ssh/id_ed25519.pub

          ssh-keyscan codeberg.org >> ~/.ssh/known_hosts

          git config --global user.name "forgejo-actions[bot]"
          git config --global user.email "bot@forgejo.local"
          git config --global gpg.format ssh
          git config --global user.signingkey ~/.ssh/id_ed25519.pub
          git config --global commit.gpgsign true

      - name: Update input
        run: nix flake update "${{ matrix.input }}"

      - name: Commit updated flake.lock
        run: |
          set -eux pipefail
          git add flake.lock

          if git diff --cached --quiet; then
            echo "No changes to commit"
            exit 0
          fi

          git commit -S -m "chore: update lockfile entry for ${{ matrix.input }}"

      - name: Push
        run: |
          git remote add codeberg git@codeberg.org:pandapip1/nixos-linux-rt.git
          git push codeberg HEAD:main
